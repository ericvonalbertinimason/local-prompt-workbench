<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My Assistant</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --me:#2f5d50; --me-fg:#fff; --bot:#fff; --line:#e2e2dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ececea; --muted:#9a9a94; --me:#3d7a69; --bot:#222220; --line:#33332f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, -apple-system, sans-serif;
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:12px 16px; padding-top:max(12px, env(safe-area-inset-top)); border-bottom:1px solid var(--line);
           font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  header button { font:inherit; font-size:14px; background:none; border:1px solid var(--line); color:var(--fg);
                  border-radius:8px; padding:4px 10px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 12px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .user { align-self:flex-end; background:var(--me); color:var(--me-fg); }
  .assistant { align-self:flex-start; background:var(--bot); border:1px solid var(--line); }
  .meta { font-size:12px; color:var(--muted); margin-top:6px; }
  form { display:flex; gap:8px; padding:10px 16px; padding-bottom:max(10px, env(safe-area-inset-bottom));
         border-top:1px solid var(--line); }
  textarea { flex:1; font:16px/1.4 inherit; resize:none; border:1px solid var(--line); border-radius:12px;
             padding:10px; background:var(--bot); color:var(--fg); max-height:40dvh; }
  form button { font:inherit; border:0; border-radius:12px; padding:0 16px; background:var(--me); color:var(--me-fg); min-height:44px; }
  form button:disabled { opacity:.5; }
</style>
</head>
<body>
<header>My Assistant <button id="new" type="button">New chat</button></header>
<div id="log"></div>
<form id="f"><textarea id="m" rows="1" placeholder="Message" enterkeyhint="send"></textarea><button id="b">Send</button></form>
<script>
const log = document.getElementById('log'), m = document.getElementById('m'), b = document.getElementById('b');
let session;
try { session = localStorage.getItem('chat-session'); } catch (e) {}
if (!session) newSession();
function newSession() {
  session = 'web-' + Date.now().toString(36);
  try { localStorage.setItem('chat-session', session); } catch (e) {}
  log.textContent = '';
}
function add(role, text, meta) {
  const d = document.createElement('div'); d.className = 'msg ' + role; d.textContent = text;
  if (meta) { const s = document.createElement('div'); s.className = 'meta'; s.textContent = meta; d.appendChild(s); }
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
fetch('/api/history?session=' + encodeURIComponent(session)).then(r => r.json())
  .then(rows => rows.forEach(r => add(r.role, r.content))).catch(() => {});
document.getElementById('new').onclick = newSession;
m.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
document.getElementById('f').onsubmit = e => { e.preventDefault(); send(); };
async function send() {
  const text = m.value.trim(); if (!text || b.disabled) return;
  add('user', text); m.value = ''; b.disabled = true;
  const wait = add('assistant', 'Thinking…');
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
                                          body: JSON.stringify({ message:text, session }) });
    const d = await r.json(); wait.remove();
    if (d.error) add('assistant', 'Error: ' + d.error);
    else add('assistant', d.reply, (d.as ? 'as "' + d.as + '" · ' : '') + (d.sources.length ? d.sources.join('  ') + ' · ' : '') + d.model + ' · ' + d.seconds + 's');
  } catch (e) { wait.remove(); add('assistant', 'Could not reach the assistant. Is this PC on?'); }
  b.disabled = false; m.focus();
}
</script>
</body>
</html>
